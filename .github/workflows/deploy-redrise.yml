name: Deploy RedRise API

on:
  push:
    branches: [master]
    paths:
      - '20-RedRise/**'
      - '.github/workflows/deploy-redrise.yml'
  pull_request:
    branches: [master]
    paths:
      - '20-RedRise/**'

env:
  REGISTRY: docker.io
  IMAGE_NAME: redrise-api
  DOCKERFILE_PATH: ./20-RedRise/Dockerfile
  CONTEXT_PATH: ./20-RedRise
  # Use a secret for the namespace, fallback to repo owner
  NAMESPACE: ${{ secrets.DOCKER_NAMESPACE || github.repository_owner }}

jobs:
  # Build and validate (runs on PRs and pushes)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT_PATH }}
          file: ${{ env.DOCKERFILE_PATH }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:ci-${{ github.sha }}

  # Push to Docker Hub (only on trusted push events)
  push:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT_PATH }}
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Static validation (PRs only)
  validate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          cd 20-RedRise
          pip install -r requirements_test.txt || echo "No test requirements found"

      - name: Lint Python files
        run: |
          cd 20-RedRise
          find . -name "*.py" -exec python -m py_compile {} \;

      - name: Validate test script syntax
        run: |
          cd 20-RedRise
          python -c "import test_redrise_integration; print('✅ Test script syntax OK')"

      - name: Check Dockerfile syntax
        uses: hadolint/hadolint-action@v3
        with:
          dockerfile: ${{ env.DOCKERFILE_PATH }}
